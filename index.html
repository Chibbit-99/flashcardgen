<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Flashcards</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 800px;
        margin: auto;
        padding: 20px;
        background: #0f0f14;
        color: white;
    }

    h1 { text-align: center; }

    /* Controls */
    .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
    }

    input, button {
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input {
        background: #23232f;
        color: white;
        border: 1px solid #3b3b4f;
    }

    button {
        cursor: pointer;
        background: #6c5ce7;
        color: white;
        font-weight: bold;
        transition: background 0.2s;
    }

    button:hover { background: #5b4cc4; }

    /* Flashcard Container (Perspective for 3D flip) */
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .flashcard {
        background-color: transparent;
        height: 200px;
        perspective: 1000px; /* Remove this if you don't want 3D effect */
        cursor: pointer;
    }

    /* The inner container: needed to position the front and back */
    .flashcard-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    /* Do the flip */
    .flashcard.flipped .flashcard-inner {
        transform: rotateY(180deg);
    }

    /* Common style for front and back */
    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* Safari */
        backface-visibility: hidden;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        font-size: 1.1em;
        line-height: 1.4;
    }

    /* Front Style */
    .card-front {
        background: #1c1c28;
        color: #fff;
        border: 1px solid #3b3b4f;
    }

    /* Back Style */
    .card-back {
        background: #6c5ce7;
        color: white;
        transform: rotateY(180deg);
    }

    /* Utility */
    #app { display: none; }
    #loginBox { text-align: center; margin-top: 50px; }
    
    /* Loading Spinner */
    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #6c5ce7;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        display: none;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>

<body>

<h1>🎴 AI Flashcards</h1>

<div id="loginBox">
    <button onclick="login()">Login with Pollinations</button>
</div>

<div id="app">
    <div class="controls">
        <input id="topic" placeholder="Enter topic (e.g. Calculus)" style="flex-grow: 1;">
        <input type="number" id="count" value="3" min="1" max="10" style="width: 60px;" title="Number of cards">
        <button onclick="generate()">Generate</button>
    </div>

    <div id="loader" class="loader"></div>
    <div id="output" class="card-grid"></div>
</div>

<script>

// ==========================
// CONFIG
// ==========================
const CLIENT_ID = "pk_AthVUCdXSHpixSqN";

// ==========================
// GET API KEY FROM URL HASH
// ==========================
let apiKey = null;

(function () {
    const hash = window.location.hash;

    if (hash.includes("api_key=")) {
        const params = new URLSearchParams(hash.slice(1));
        apiKey = params.get("api_key");

        // clean URL
        window.history.replaceState({}, document.title, "/");

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("app").style.display = "block";
    }
})();

// ==========================
// LOGIN
// ==========================
function login() {
    const url =
        "https://enter.pollinations.ai/authorize?" +
        new URLSearchParams({
            client_id: CLIENT_ID,
            redirect_uri: window.location.href
        });

    window.location.href = url;
}

// ==========================
// GENERATE FLASHCARDS
// ==========================
async function generate() {
    const topic = document.getElementById("topic").value;
    const count = document.getElementById("count").value;
    const outputDiv = document.getElementById("output");
    const loader = document.getElementById("loader");

    if (!topic) return alert("Please enter a topic");

    // UI State: Loading
    outputDiv.innerHTML = "";
    loader.style.display = "block";

    try {
        const res = await fetch(
            "https://gen.pollinations.ai/v1/chat/completions",
            {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + apiKey,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "openai",
                    messages: [
                        {
                            role: "system",
                            content: "You are a teacher. Return a raw JSON array (no markdown) of objects with keys: 'front' and 'back'."
                        },
                        {
                            role: "user",
                            content: `Create ${count} flashcards about: ${topic}. Make them concise.`
                        }
                    ]
                })
            }
        );

        const data = await res.json();
        
        // Clean markdown if the AI adds it despite instructions
        let raw = data.choices[0].message.content
            .replace(/```json/g, "")
            .replace(/```/g, "")
            .trim();

        let cards = JSON.parse(raw);

        // Render Cards
        cards.forEach(card => {
            const cardEl = document.createElement("div");
            cardEl.className = "flashcard";
            
            // Click to flip functionality
            cardEl.onclick = () => {
                cardEl.classList.toggle("flipped");
            };

            cardEl.innerHTML = `
                <div class="flashcard-inner">
                    <div class="card-face card-front">
                        <h3>${card.front}</h3>
                    </div>
                    <div class="card-face card-back">
                        <p>${card.back}</p>
                    </div>
                </div>
            `;

            outputDiv.appendChild(cardEl);
        });

    } catch (error) {
        console.error(error);
        alert("Error generating cards. Please try again.");
    } finally {
        loader.style.display = "none";
    }
}

</script>

</body>
</html>
